<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="personaTitle">
<title id="personaTitle">Illustratie van Marit Veenhuizen, hoofdredacteur van KennisCentrum Haptonomie</title>
<circle cx="120" cy="120" r="120" fill="#F1EBE1"/>
<circle cx="120" cy="120" r="112" fill="#FCEFE4"/>

<!-- shoulders / top -->
<path d="M40 236c6-46 40-70 80-70s74 24 80 70" fill="#3F6259"/>
<path d="M40 236c6-46 40-70 80-70s74 24 80 70" fill="none" stroke="#2E4A43" stroke-width="2"/>
<path d="M92 172c8 10 20 16 28 16s20-6 28-16" fill="none" stroke="#2E4A43" stroke-width="2" opacity="0.5"/>

<!-- neck -->
<rect x="104" y="150" width="32" height="30" rx="12" fill="#F2C9A4"/>

<!-- hair back -->
<path d="M62 118c-4-46 24-78 58-78s62 32 58 78c0 8-2 20-8 30-2-30-16-30-16-52-14 10-64 10-78 0 0 22-14 22-16 52-6-10-8-22 2-30z" fill="#7A4A32"/>

<!-- face -->
<ellipse cx="120" cy="118" rx="52" ry="58" fill="#F7D3AE"/>

<!-- ears -->
<ellipse cx="66" cy="122" rx="8" ry="12" fill="#F2C9A4"/>
<ellipse cx="174" cy="122" rx="8" ry="12" fill="#F2C9A4"/>

<!-- hair front / fringe -->
<path d="M68 100c6-34 26-54 52-54s46 20 52 54c-10-14-30-20-52-20s-42 6-52 20z" fill="#7A4A32"/>
<path d="M64 108c2-8 6-14 10-18-2 10-2 20 2 30-8-2-12-6-12-12z" fill="#7A4A32"/>
<path d="M176 108c-2-8-6-14-10-18 2 10 2 20-2 30 8-2 12-6 12-12z" fill="#7A4A32"/>

<!-- eyebrows -->
<path d="M92 108c6-5 16-6 22-3" fill="none" stroke="#5C3A26" stroke-width="3" stroke-linecap="round"/>
<path d="M148 108c-6-5-16-6-22-3" fill="none" stroke="#5C3A26" stroke-width="3" stroke-linecap="round"/>

<!-- eyes -->
<path d="M96 122c4-4 12-4 16 0" fill="none" stroke="#3B2A20" stroke-width="3" stroke-linecap="round"/>
<path d="M144 122c-4-4-12-4-16 0" fill="none" stroke="#3B2A20" stroke-width="3" stroke-linecap="round"/>

<!-- blush -->
<ellipse cx="90" cy="140" rx="9" ry="6" fill="#E99B7C" opacity="0.45"/>
<ellipse cx="150" cy="140" rx="9" ry="6" fill="#E99B7C" opacity="0.45"/>

<!-- nose -->
<path d="M120 118c-2 8-4 14-2 18 2 3 6 3 8 1" fill="none" stroke="#D8A87C" stroke-width="2.5" stroke-linecap="round"/>

<!-- mouth: warm smile -->
<path d="M100 150c8 10 32 10 40 0" fill="none" stroke="#A5553F" stroke-width="4" stroke-linecap="round"/>

<!-- simple earrings -->
<circle cx="66" cy="134" r="3" fill="#C1694F"/>
<circle cx="174" cy="134" r="3" fill="#C1694F"/>

<!-- necklace hint -->
<path d="M104 172c6 6 26 6 32 0" fill="none" stroke="#C1694F" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

<circle cx="120" cy="120" r="118" fill="none" stroke="#E3DCCE" stroke-width="2"/>
</svg>
